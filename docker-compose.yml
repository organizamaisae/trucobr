services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: truco
      POSTGRES_USER: truco
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - truco_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U truco]
      interval: 5s
      retries: 10
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://truco:${POSTGRES_PASSWORD}@db:5432/truco
      CORS_ORIGINS: http://localhost:8080
    depends_on:
      db:
        condition: service_healthy
volumes:
  truco_data:
