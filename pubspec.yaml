name: aurora_cards
description: Aurora Truco online com partidas autoritativas e fichas virtuais.
publish_to: none
version: 3.2.0+5
environment:
  sdk: ^3.13.0
dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  web_socket_channel: ^3.0.3
  flutter_secure_storage: ^10.0.0
  cupertino_icons: ^1.0.8
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/truco-br-banner.png
    - assets/images/truco-br-background.png
    - assets/images/truco-br-avatar.png
    - assets/images/truco-br-tournaments.png
    - assets/images/truco-br-bar-table.png
    - assets/images/truco-br-characters.png
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: RoyalSerif
      fonts:
        - asset: assets/fonts/CormorantGaramond-Bold.ttf
          weight: 700
