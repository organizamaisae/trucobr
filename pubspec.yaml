name: aurora_cards
description: Jogo recreativo de cartas de ação e pontos sem valor monetário.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ^3.13.0
dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  cupertino_icons: ^1.0.8
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/aurora-logo.png
    - assets/images/aurora-emblem-transparent.png
  fonts:
    - family: RoyalSerif
      fonts:
        - asset: assets/fonts/CormorantGaramond-Bold.ttf
          weight: 700
