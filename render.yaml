services:
  - type: web
    name: aurora-cards-server
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server/server.py --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: http://localhost:8080
      - key: PYTHON_VERSION
        value: 3.13.7
